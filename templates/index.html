<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CO₂ Emission Predictor</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>CO₂ Emission Prediction</h1>

        <form action="/predict" method="POST">

            <label>Make</label>
            <input type="text" name="Make" required>

            <label>Model</label>
            <input type="text" name="Model" required>

            <label>Vehicle Class</label>
            <input type="text" name="Vehicle_Class" required>

            <label>Engine Size (L)</label>
            <input type="number" step="0.1" name="Engine_Size_L" required>

            <label>Cylinders</label>
            <input type="number" name="Cylinders" required>

            <label>Transmission</label>
            <input type="text" name="Transmission" required>

            <label>Fuel Type</label>
            <input type="text" name="Fuel_Type" required>

            <label>Fuel Consumption City (L/100 km)</label>
            <input type="number" step="0.1" name="Fuel_Consumption_City_L_100_km" required>

            <label>Fuel Consumption Hwy (L/100 km)</label>
            <input type="number" step="0.1" name="Fuel_Consumption_Hwy_L_100_km" required>

            <label>Fuel Consumption Comb (L/100 km)</label>
            <input type="number" step="0.1" name="Fuel_Consumption_Comb_L_100_km" required>

            <label>Fuel Consumption Comb (mpg)</label>
            <input type="number" step="0.1" name="Fuel_Consumption_Comb_mpg" required>

            <button type="submit">
                Predict
            </button>

        </form>

    </div>

</body>

</html>
